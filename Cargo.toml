[package]
name = "spica"
version = "0.2"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
regex = "1.13.1"
reqwest = {  version = "0.13.5", features = ["form", "cookies", "json"] }
reqwest_cookie_store = "0.10.0"
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.9", features = [ "runtime-tokio", "postgres" ] }
tokio = { version = "1", features = ["full"] }
